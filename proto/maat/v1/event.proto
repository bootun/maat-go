syntax = "proto3";

package maat.v1;

import "google/protobuf/timestamp.proto";
import "maat/v1/common.proto";
import "maat/v1/session.proto";
import "maat/v1/tool.proto";

// EventService 提供会话事件的实时订阅与历史读取（spec §11）。
service EventService {
  // StreamSessionEvents 先补齐 resume token 之后的已提交事件，再接实时流（spec §11.4）。
  rpc StreamSessionEvents(StreamSessionEventsRequest) returns (stream StreamSessionEventsResponse);
  // ListSessionEvents 分页读取已提交事件（spec §11.6）。
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Event 是会话级只追加日志中的一条记录（spec §11.2）。
// 已提交事件的 seq 在会话内严格递增、无空洞；瞬时事件（delta、marker）的 seq 为 0，只在实时流中出现。
// oneof 编号一经发布不得修改或复用（plan 附录 B.3）。
message Event {
  string session_id = 1;
  // 0 表示瞬时事件。
  uint64 seq = 2;
  string thread_id = 3;
  string run_id = 4;
  string step_id = 5;
  // 瞬时事件携带 step 的 attempt；已提交事件为 0。
  uint32 attempt = 6;
  google.protobuf.Timestamp time = 7;
  // 冗余的类型字符串，SSE 用作 event 名，例如 "agent.message"。
  string type = 8;

  oneof payload {
    // ---------- 会话 ----------
    SessionCreated session_created = 20;
    SessionForked session_forked = 21;
    SessionStatusChanged session_status_changed = 22;
    SessionArchived session_archived = 23;
    SessionUnarchived session_unarchived = 24;
    SessionInterrupted session_interrupted = 25;
    // ---------- 线程 ----------
    ThreadCreated thread_created = 30;
    ThreadStatusChanged thread_status_changed = 31;
    ThreadCompacted thread_compacted = 32;
    // ---------- Run ----------
    RunStarted run_started = 40;
    RunCompleted run_completed = 41;
    RunFailed run_failed = 42;
    // ---------- 用户消息 ----------
    UserMessage user_message = 50;
    UserMessageDelivered user_message_delivered = 51;
    // ---------- Agent 输出 ----------
    AgentMessage agent_message = 60;
    AgentToolCall agent_tool_call = 61;
    // ---------- 工具调用 ----------
    ToolCallClaimed tool_call_claimed = 70;
    ToolCallCompleted tool_call_completed = 71;
    ToolCallFailed tool_call_failed = 72;
    ToolCallCancelled tool_call_cancelled = 73;
    ToolCallReopened tool_call_reopened = 74;
    ToolCallsResolved tool_calls_resolved = 75;
    // ---------- Step ----------
    StepCompleted step_completed = 80;
    // ---------- 瞬时事件 ----------
    StreamMarker stream_marker = 100;
    AgentMessageDelta agent_message_delta = 101;
    AgentReasoningDelta agent_reasoning_delta = 102;
    AgentToolCallDelta agent_tool_call_delta = 103;
    ThreadCompactionStarted thread_compaction_started = 104;
    StreamHeartbeat stream_heartbeat = 105;
    StreamReset stream_reset = 106;
    StreamLagged stream_lagged = 107;
  }
}

// session.created
message SessionCreated {
  string agent_id = 1;
  uint32 agent_version = 2;
  string model = 3;
  map<string, string> metadata = 4;
  string title = 5;
  string primary_thread_id = 6;
}

// session.forked：新会话的第一条事件。
message SessionForked {
  string from_session_id = 1;
  string from_checkpoint_id = 2;
  uint64 from_seq = 3;
  string executor_state_ref = 4;
}

// session.status_changed
message SessionStatusChanged {
  SessionStatus status = 1;
  uint32 pending_tool_calls = 2;
}

// session.archived
message SessionArchived {}

// session.unarchived
message SessionUnarchived {}

// session.interrupted
message SessionInterrupted {
  string thread_id = 1;
  uint32 generation = 2;
}

// thread.created
message ThreadCreated {
  string parent_thread_id = 1;
  string parent_tool_call_id = 2;
  string agent_name = 3;
  ThreadMode mode = 4;
  uint32 depth = 5;
  repeated string path = 6;
}

// thread.status_changed
message ThreadStatusChanged {
  ThreadStatus status = 1;
  StopReason stop_reason = 2;
}

// thread.compacted
message ThreadCompacted {
  string summary_ref = 1;
  uint64 tokens_before = 2;
  uint64 tokens_after = 3;
  string checkpoint_id = 4;
}

// run.started
message RunStarted {
  RunTrigger trigger = 1;
  string model = 2;
}

// run.completed
message RunCompleted {
  StopReason stop_reason = 1;
  Usage usage = 2;
  // 最后一条 assistant 文本的前 512 字符。
  string final_text_preview = 3;
}

// run.failed
message RunFailed {
  string code = 1;
  // 已脱敏的上游错误摘要。
  string message = 2;
}

// user.message
message UserMessage {
  string message_id = 1;
  InboxKind kind = 2;
  // 内容；过大时只给预览（truncated=true），完整内容见 content_ref。
  MessageInput content = 3;
  string content_ref = 4;
  bool truncated = 5;
  Delivery delivery = 6;
  string client_message_id = 7;
}

// user.message_delivered：消息在某个 step 开始前并入上下文。
message UserMessageDelivered {
  string message_id = 1;
  string run_id = 2;
  uint32 step_index = 3;
  string checkpoint_id = 4;
}

// agent.message：一个 step 的 assistant 输出（已提交，权威内容）。
message AgentMessage {
  // 文本 > 16KB 时只给预览（text_truncated=true），完整内容见 content_ref。
  string text = 1;
  bool text_truncated = 2;
  string content_ref = 3;
  // 推理内容（模型支持时）。
  string reasoning = 4;
  // 中断时已流出的部分输出。
  bool partial = 5;
}

// agent.tool_call：已提交的 CLIENT 工具调用，Executor 据此认领。
message AgentToolCall {
  ToolCall tool_call = 1;
}

// tool_call.claimed
message ToolCallClaimed {
  string tool_call_id = 1;
  string executor_id = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
  uint32 dispatch_attempt = 4;
}

// tool_call.completed
message ToolCallCompleted {
  string tool_call_id = 1;
  bool is_error = 2;
  // 结果预览（> 4KB 时截断，truncated=true），完整结果见 result_ref。
  ToolResult result = 3;
  string result_ref = 4;
  bool truncated = 5;
  string executor_id = 6;
  uint64 duration_ms = 7;
}

// tool_call.failed
message ToolCallFailed {
  string tool_call_id = 1;
  // executor_lost / timeout / unknown_tool / invalid_arguments / arguments_truncated 等。
  string reason = 2;
  string message = 3;
}

// tool_call.cancelled
message ToolCallCancelled {
  string tool_call_id = 1;
  string reason = 2;
}

// tool_call.reopened：幂等工具在执行器掉线后重新开放认领。
message ToolCallReopened {
  string tool_call_id = 1;
  uint32 dispatch_attempt = 2;
}

// tool_calls.resolved：某 step 的全部工具调用都已解决。
message ToolCallsResolved {
  string step_id = 1;
}

// step.completed
message StepCompleted {
  uint32 index = 1;
  // 模型别名。
  string model = 2;
  string upstream_model = 3;
  string finish_reason = 4;
  Usage usage = 5;
  uint32 attempts = 6;
  uint32 ttft_ms = 7;
  uint32 total_ms = 8;
  string checkpoint_id = 9;
}

// stream.marker：每个 step attempt 开始时写入（step_id 与 attempt 在信封上）。
// 同一 step 出现更大的 attempt，客户端丢弃该 step 的预览并重新渲染（spec §11.5）。
message StreamMarker {}

// agent.message.delta
message AgentMessageDelta {
  string text = 1;
}

// agent.reasoning.delta
message AgentReasoningDelta {
  string text = 1;
}

// agent.tool_call.delta
message AgentToolCallDelta {
  // 调用在本 step 中的位置。
  uint32 index = 1;
  string name = 2;
  string args_fragment = 3;
}

// thread.compaction_started
message ThreadCompactionStarted {}

// stream.heartbeat：每 15s 一次，携带最新的 resume token。
message StreamHeartbeat {
  string resume_token = 1;
  // 服务端即将关闭该流（如优雅关闭），客户端应立即用 resume_token 重连。
  bool closing = 2;
}

// stream.reset：客户端应丢弃所有未提交的预览。
message StreamReset {}

// stream.lagged：订阅者过慢，丢弃了部分瞬时事件。
message StreamLagged {
  uint64 dropped_count = 1;
}

message StreamSessionEventsRequest {
  string project_id = 1;
  string session_id = 2;
  // 续传位置；为空时从 after_seq 开始。
  string resume_token = 3;
  // 首次订阅的起点（通常为 0，或已加载历史的末尾）。
  uint64 after_seq = 4;
  // 是否推送瞬时事件；未设置时为 true。
  optional bool include_deltas = 5;
  // 只推送这些线程的事件；为空表示全部线程。
  repeated string thread_ids = 6;
  // 是否推送子线程的瞬时事件（默认只推送 primary 线程的）。
  bool include_subthread_deltas = 7;
}

message StreamSessionEventsResponse {
  Event event = 1;
  // 处理完这条事件后的续传位置。
  string resume_token = 2;
}

message ListSessionEventsRequest {
  string project_id = 1;
  string session_id = 2;
  // 返回 seq > after_seq 的事件。
  uint64 after_seq = 3;
  // page_size ≤ 500；include_ancestors 时 page_token 编码祖先链位置。
  PageRequest page = 4;
  repeated string thread_ids = 5;
  // 只返回这些类型，例如 "agent.message"。
  repeated string types = 6;
  // 先返回祖先会话在 fork 点之前的事件（spec §8.3）。
  bool include_ancestors = 7;
  // 把 ref 内容内联进来（每条上限 256KB）。
  bool expand_refs = 8;
}

message ListSessionEventsResponse {
  repeated Event events = 1;
  PageResponse page = 2;
}
